<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:;" />
    <title>Cadence Mini</title>
    <style>
      * { box-sizing:border-box; }
      html, body { margin:0; height:100%; background:transparent; overflow:hidden;
        font-family:"Segoe UI",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
      /* The card fills the window minus its drop-shadow margin. It used to be a
         hard 120px inside a 120px window, so the card overflowed by its own
         margin and the transport row was clipped off the bottom — the window is
         now sized to the content (see MINI_W/MINI_H in miniPlayer.js). */
      #card {
        height:calc(100% - 12px); margin:6px; border-radius:16px; background:rgba(18,18,21,.92);
        backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.07);
        box-shadow:0 16px 50px rgba(0,0,0,.5); display:flex; flex-direction:column; color:#f1f1f3;
        -webkit-app-region:drag; position:relative; overflow:hidden;
      }
      #top { display:flex; gap:12px; padding:12px 12px 6px; align-items:center; flex:0 0 auto; }
      #art { width:64px; height:64px; border-radius:10px; object-fit:cover; background:#26262b; flex:0 0 auto; }
      #meta { min-width:0; flex:1; }
      #title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:14px; }
      #artist { font-size:12px; color:#9aa0a6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
      #close { position:absolute; top:6px; right:8px; color:#6b6f78; font-size:14px; cursor:pointer; -webkit-app-region:no-drag; }
      #close:hover { color:#fff; }

      #seekRow { display:flex; align-items:center; gap:8px; padding:2px 14px; flex:0 0 auto; }
      .time { font-size:11px; color:#9aa0a6; font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:32px; }
      #total { text-align:right; }

      /* Both sliders paint their own filled portion from a --pct custom property
         so the fill tracks the thumb without a second element. */
      input[type=range] {
        -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer;
        flex:1 1 auto; height:14px; margin:0; -webkit-app-region:no-drag; --pct:0%;
      }
      input[type=range]::-webkit-slider-runnable-track {
        height:4px; border-radius:4px;
        background:linear-gradient(to right, #ff2d55 var(--pct), rgba(255,255,255,.14) var(--pct));
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance:none; width:11px; height:11px; margin-top:-3.5px;
        border-radius:50%; background:#fff; opacity:0; transition:opacity .12s;
      }
      /* Thumbs stay out of the way until the card is hovered — the filled track
         already communicates position. */
      #card:hover input[type=range]::-webkit-slider-thumb { opacity:1; }
      input[type=range]:focus { outline:none; }
      #card:hover #vol { opacity:1; }
      #vol { max-width:64px; opacity:.55; transition:opacity .12s; }

      #ctrls { display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
        padding:4px 12px 12px; flex:0 0 auto; -webkit-app-region:no-drag; }
      #transport { display:flex; align-items:center; gap:12px; }
      #volWrap { display:flex; align-items:center; gap:6px; justify-self:end; }
      button { background:none; border:0; color:#e9e9ee; cursor:pointer; padding:4px; border-radius:8px; display:flex; }
      button:hover { color:#fff; background:rgba(255,255,255,.08); }
      button svg { width:22px; height:22px; fill:currentColor; }
      #play svg { width:30px; height:30px; }
      #mute svg { width:18px; height:18px; }
      #mute { color:#9aa0a6; }
      .liked { color:#ff2d55 !important; }
    </style>
  </head>
  <body>
    <div id="card">
      <span id="close" title="Close">✕</span>
      <div id="top">
        <img id="art" alt="" />
        <div id="meta">
          <div id="title">Nothing playing</div>
          <div id="artist">—</div>
        </div>
      </div>

      <div id="seekRow">
        <span class="time" id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" title="Seek" />
        <span class="time" id="total">0:00</span>
      </div>

      <div id="ctrls">
        <button id="like" title="Like"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.6 1.6 5 5 5c2 0 3.2 1.2 4 2.3C9.8 6.2 11 5 13 5c3.4 0 4.7 3.6 3 6.8C19.5 16.4 12 21 12 21z"/></svg></button>
        <div id="transport">
          <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button id="play" title="Play/Pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
        </div>
        <div id="volWrap">
          <button id="mute" title="Mute"><svg id="volIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg></button>
          <input id="vol" type="range" min="0" max="100" value="60" step="1" title="Volume" />
        </div>
      </div>
    </div>

    <script>
      const C = window.cadence;
      const $ = (id) => document.getElementById(id);
      const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
      const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      const ICON_VOL = '<path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/>';
      const ICON_MUTED = '<path d="M4 9v6h4l5 4V5L8 9H4zm15.1 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/>';

      // While a slider is under the pointer (or the keyboard), incoming player
      // state must not yank it back — otherwise a drag fights the ~1/s ticks.
      let seeking = false;
      let volDragging = false;
      let duration = 0;

      const fmt = (secs) => {
        const s = Math.max(0, Math.floor(secs || 0));
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      };
      const setPct = (el, pct) => el.style.setProperty('--pct', Math.max(0, Math.min(100, pct)) + '%');

      function paint(s) {
        $('title').textContent = s.hasSong ? (s.title || 'Unknown') : 'Nothing playing';
        $('artist').textContent = s.hasSong ? (s.artist || '') : '—';
        if (s.artworkUrl && $('art').src !== s.artworkUrl) $('art').src = s.artworkUrl;
        $('playIcon').innerHTML = (s.hasSong && !s.isPaused) ? ICON_PAUSE : ICON_PLAY;
        $('like').classList.toggle('liked', s.liked === 'LIKE');

        duration = s.duration || 0;
        $('total').textContent = fmt(duration);
        if (!seeking) {
          const pct = duration ? Math.min(100, (s.currentTime / duration) * 100) : 0;
          $('seek').value = Math.round(pct * 10);
          setPct($('seek'), pct);
          $('elapsed').textContent = fmt(s.currentTime);
        }

        const muted = !!s.muted || s.volume === 0;
        $('volIcon').innerHTML = muted ? ICON_MUTED : ICON_VOL;
        if (!volDragging) {
          const v = muted ? 0 : (s.volume || 0);
          $('vol').value = v;
          setPct($('vol'), v);
        }
      }

      $('play').onclick = () => C.control('playPause');
      $('next').onclick = () => C.control('next');
      $('prev').onclick = () => C.control('previous');
      $('like').onclick = () => C.control('like');
      $('mute').onclick = () => C.control('muteToggle');
      $('close').onclick = () => C.toggleMini();

      // Seek: scrub locally on input, commit the seek on release.
      $('seek').addEventListener('pointerdown', () => { seeking = true; });
      $('seek').addEventListener('keydown', () => { seeking = true; });
      $('seek').addEventListener('input', () => {
        const pct = $('seek').value / 10;
        setPct($('seek'), pct);
        $('elapsed').textContent = fmt((pct / 100) * duration);
      });
      $('seek').addEventListener('change', () => {
        if (duration) C.control('seek', ($('seek').value / 1000) * duration);
        seeking = false;
      });

      // Volume: apply live so the fader behaves like a fader, not a commit box.
      $('vol').addEventListener('pointerdown', () => { volDragging = true; });
      $('vol').addEventListener('keydown', () => { volDragging = true; });
      $('vol').addEventListener('input', () => {
        const v = Number($('vol').value);
        setPct($('vol'), v);
        C.control('volume', v);
      });
      $('vol').addEventListener('change', () => { volDragging = false; });

      // A pointer released outside the slider still ends the drag; defer so the
      // element's own change handler runs first.
      const endDrag = () => setTimeout(() => { seeking = false; volDragging = false; }, 0);
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      C.onState(paint);
      C.getState().then(paint);
    </script>
  </body>
</html>
